
name: LifeFlow CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    name: LifeFlow Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ secrets.CI_MONGODB_URI }}
          SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}

      - name: Production build
        run: npm run build
